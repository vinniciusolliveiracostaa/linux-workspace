[workspace]
resolver = "2"
members = [
    # Core - Domain puro, zero deps externas
    "core/de-domain",
    "core/de-protocol",
    
    # Infra - Backends técnicos
    "infra/de-x11",
    "infra/de-render-trait",
    "infra/de-render-cpu",
    "infra/de-render-gpu",
    "infra/de-ipc",
    
    # libs - Bibliotecas compartilhadas
    "libs/de-theme",
    "libs/de-widgets",
    "libs/de-config",
    
    # Apps - Binários independentes (NÃO importam outros apps)
    "apps/de-wm",
    "apps/de-compositor",
    "apps/de-panel",
    "apps/de-launcher",
    "apps/de-notifications",
]

[workspace.package]
version = "0.2.0"
edition = "2021"
authors = ["Desktop Environment Team"]
license = "MIT"

[workspace.dependencies]
# ============================================
# CORE - Domain puro
# ============================================
de-domain = { path = "core/de-domain" }
de-protocol = { path = "core/de-protocol" }

# ============================================
# INFRA - Backends técnicos
# ============================================
de-x11 = { path = "infra/de-x11" }
de-render-trait = { path = "infra/de-render-trait" }
de-render-cpu = { path = "infra/de-render-cpu" }
de-render-gpu = { path = "infra/de-render-gpu" }
de-ipc = { path = "infra/de-ipc" }

# ============================================
# LIBS - Bibliotecas compartilhadas
# ============================================
de-theme = { path = "libs/de-theme" }
de-widgets = { path = "libs/de-widgets" }
de-config = { path = "libs/de-config" }

# ============================================
# X11
# ============================================
xcb = { version = "1.5", features = ["xkb", "randr", "shape", "xfixes", "composite"] }
xcb-wm = "0.4"
x11rb = "0.13"
xkbcommon = "0.7"

# ============================================
# RENDERING - GPU com wgpu
# ============================================
wgpu = "0.20"
pixels = "0.15"
winit = "0.30"
tiny-skia = "0.11"
glyphon = "0.7"
cosmic-text = "0.12"

# ============================================
# FONTES
# ============================================
fontdue = "0.9"
rustybuzz = "0.14"

# ============================================
# IPC / DBUS
# ============================================
zbus = { version = "4", default-features = false, features = ["tokio"] }
bincode = "=1.3.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# ============================================
# UTILS
# ============================================
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"

# ============================================
# CONFIG / FILE WATCH
# ============================================
notify = "7.0"
toml = "0.8"
dirs = "5.0"
chrono = "0.4"

# ============================================
# MATH / GEOMETRY
# ============================================
euclid = "0.22"

# ============================================
# ASYNC
# ============================================
tokio = { version = "1.35", features = ["full"] }
futures = "0.3"
async-channel = "2.0"

# ============================================
# FUZZY MATCHING (launcher)
# ============================================
nucleo-matcher = "0.3"